name: backend-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write            # lets the workflow push to GHCR
jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64 runner (free for public repos), matches your VM
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tamirlanm/lost-found-api:${{ github.sha }}
            ghcr.io/tamirlanm/lost-found-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
